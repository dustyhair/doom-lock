name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        wad: ['true', 'false']
    env:
      CC: ${{ matrix.compiler }}
      DOOM_CI_WAD: ${{ matrix.wad }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat ci/packages.txt)
      - name: Build and check without game assets
        run: |
          python3 tools/audit-release.py
          sh ci/check.sh
